# Database connection settings for MySQL
spring.datasource.url=jdbc:mysql://mysql-productservice:3306/productdb
spring.datasource.username=user
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.application.name=product-service
server.port=8080
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# JWT authentication settings
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://USER-SERVICE:3030/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://USER-SERVICE:3030


management.metrics.system.enabled=false


# Service Discovery settings
eureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/ 
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true